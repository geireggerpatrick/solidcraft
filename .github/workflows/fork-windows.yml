# A test build for Windows x64 from this fork's generative-design work: solidcraft.exe alone,
# unsigned, as a workflow artifact. Run it from anywhere, beside an installed SolidCraft. Built
# without link-time optimisation, the CLI and the installer, so that a test build is quick.
# Not a release: nothing is published.
name: Fork Windows test build

on:
  workflow_dispatch:
  push:
    branches: ['generative-design*']

permissions:
  contents: read

concurrency:
  group: fork-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      SOLIDCRAFT_VERSION: 0.42.0-generative
      CARGO_PROFILE_RELEASE_LTO: "off"
      # Static CRT: no VC++ redistributable needed.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-windows-x64-quick
      - name: Build the app
        run: cargo build --release --locked -p solidcraft --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solidcraft-generative-windows-x64
          path: target/x86_64-pc-windows-msvc/release/solidcraft.exe
          if-no-files-found: error
