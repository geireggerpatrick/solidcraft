[package]
name = "solidcraft-generative-gpu"
description = "SolidCraft generative design on the GPU: the voxel grid's linear problems solved by multigrid-preconditioned conjugate gradients in wgpu compute shaders"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
solidcraft-generative = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
solidcraft-viewport-gpu = { workspace = true }
wgpu = { workspace = true, features = ["metal", "vulkan", "dx12"] }
pollster = { workspace = true }
